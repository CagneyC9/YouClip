<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/scissor.png">
  <title>YouClip</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container { width: min(1100px, 92vw); }

    .player-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    #player { width: 100%; height: 100%; }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      padding: 9px 15px;
      border: 0;
      border-radius: 8px;
      background: #3ea6ff;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    #progress {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    #time {
      min-width: 85px;
      text-align: right;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .details {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      color: #aaa;
      font-size: 14px;
    }

    .details a { color: #3ea6ff; }

    .error {
      display: none;
      margin-top: 20px;
      color: #ff8a80;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="player-wrap">
      <div id="player"></div>
    </div>
    <div class="controls">
      <button id="play-button" type="button" disabled>Play</button>
      <input id="progress" type="range" min="0" max="1000" value="0"
             aria-label="Clip position" disabled />
      <span id="time">0:00 / 0:00</span>
    </div>

    <div class="details">
      <span id="clip-range"></span>
      <a id="original-link" target="_blank" rel="noopener noreferrer">
        Watch original video
      </a>
    </div>

    <p id="error" class="error">
      Invalid clip link. The link needs a video ID, start time, and end time.
    </p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);

const videoId = params.get("v");
const start = Number(params.get("t"));
const end = Number(params.get("end"));

const duration = end - start;

    const errorEl = document.getElementById("error");
    const rangeEl = document.getElementById("clip-range");
    const originalLink = document.getElementById("original-link");
    const playButton = document.getElementById("play-button");
    const progress = document.getElementById("progress");
    const timeEl = document.getElementById("time");

    function formatTime(value) {
      const seconds = Math.floor(Math.max(0, value));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainder = String(seconds % 60).padStart(2, "0");

      return hours
        ? `${hours}:${String(minutes).padStart(2, "0")}:${remainder}`
        : `${minutes}:${remainder}`;
    }

    if (
      !videoId ||
      !/^[\w-]{11}$/.test(videoId) ||
      !Number.isFinite(start) ||
      !Number.isFinite(end) ||
      start < 0 ||
      end <= start
    ) {
      errorEl.style.display = "block";
      throw new Error("Invalid clip parameters");
    }

    rangeEl.textContent =
      `Clip from ${formatTime(start)} to ${formatTime(end)}`;

    originalLink.href =
      `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}&t=${Math.floor(start)}s`;

    timeEl.textContent = `0:00 / ${formatTime(duration)}`;

    let player;
    let timerId;

    function updateControls() {
      if (!player || typeof player.getCurrentTime !== "function") return;

      const current = player.getCurrentTime();
      const elapsed = Math.max(0, Math.min(duration, current - start));

      progress.value = String(Math.round((elapsed / duration) * 1000));
      timeEl.textContent =
        `${formatTime(elapsed)} / ${formatTime(duration)}`;

      if (current >= end) {
        player.pauseVideo();
        player.seekTo(start, true);
        progress.value = "0";
        timeEl.textContent = `0:00 / ${formatTime(duration)}`;
        playButton.textContent = "Replay";
      }
    }

    playButton.addEventListener("click", () => {
      if (!player) return;

      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        const current = player.getCurrentTime();
        if (current < start || current >= end) {
          player.seekTo(start, true);
        }
        player.playVideo();
      }
    });

    progress.addEventListener("input", () => {
      if (!player) return;

      const elapsed = (Number(progress.value) / 1000) * duration;
      player.seekTo(start + elapsed, true);
      timeEl.textContent =
        `${formatTime(elapsed)} / ${formatTime(duration)}`;
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId,
        playerVars: {
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: () => {
            player.seekTo(start, true);
            playButton.disabled = false;
            progress.disabled = false;
            timerId = setInterval(updateControls, 100);
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              playButton.textContent = "Pause";
            } else if (event.data === YT.PlayerState.PAUSED) {
              playButton.textContent = "Play";
            }
          }
        }
      });
    }

    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  </script>
</body>
</html>
