<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Clip</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f0f0f;
        color: white;
        font-family: Arial, sans-serif;
      }

      .container {
        width: min(1100px, 92vw);
      }

      .player-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      #player {
        width: 100%;
        height: 100%;
      }

      .meta {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .pill {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 14px;
      }

      .error {
        display: none;
        margin-top: 20px;
        color: #ff8a80;
      }

      .clip-title {
        margin: 16px 0 0;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="player-wrap">
        <div id="player"></div>
      </div>

      <h1 id="clip-title" class="clip-title" hidden></h1>

      <div class="meta">
        <div class="pill" id="clip-range">Clip range: waiting…</div>
      </div>

      <div id="error" class="error">
        Missing clip data. Use a link like: /?v=VIDEO_ID&s=30&e=60
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get("v");
      const start = Number(params.get("s") || 0);
      const end = Number(params.get("e") || 0);
      const clipTitle = params.get("t");

      const errorEl = document.getElementById("error");
      const rangeEl = document.getElementById("clip-range");
      const titleEl = document.getElementById("clip-title");

      if (clipTitle) {
        titleEl.textContent = clipTitle;
        titleEl.hidden = false;
      }

      if (!videoId || !Number.isFinite(start) || !Number.isFinite(end) || end <= start) {
        errorEl.style.display = "block";
        throw new Error("Invalid clip parameters");
      }

      rangeEl.textContent = `Clip range: ${formatSeconds(start)} to ${formatSeconds(end)}`;

      function formatSeconds(value) {
        const minutes = Math.floor(value / 60);
        const seconds = String(Math.floor(value % 60)).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      let player;
      let intervalId = null;

      function onPlayerReady() {
        player.seekTo(start, true);
        player.playVideo();

        intervalId = setInterval(() => {
          if (!player || !player.getCurrentTime) {
            return;
          }

          const currentTime = player.getCurrentTime();

          if (currentTime >= end) {
            player.pauseVideo();
            if (intervalId) {
              clearInterval(intervalId);
            }
          }
        }, 250);
      }

      function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
          videoId,
          playerVars: {
            autoplay: 1,
            controls: 1,
            rel: 0,
            modestbranding: 1,
          },
          events: {
            onReady: onPlayerReady,
          },
        });
      }

      window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
    </script>
  </body>
</html>
